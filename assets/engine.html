<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>比例尺</title>
<!-- TS:FRAGMENT-START -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* 比例尺 to-scale 渲染引擎 · 卷尺黄 + 墨黑 · 签名：卷尺刻度条 */
:root{
  --tape:#FFCE1F; --ink:#121316; --paper:#F0EFEA; --red:#E4412B; --night:#06080C;
  --f-zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:"Archivo","Noto Sans SC","PingFang SC",sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-zh);line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--ink)}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

.tone-paper{--bg:#F0EFEA;--fg:#121316;--mu:#5C5E66;--line:#C6C5BE;--hi:#E4412B;--on-hi:#FFFFFF}
.tone-night{--bg:#06080C;--fg:#E7E9EE;--mu:#8A92A3;--line:#2A303B;--hi:#FFCE1F;--on-hi:#06080C}
.tone-tape{--bg:#FFCE1F;--fg:#121316;--mu:#4F4100;--line:rgba(18,19,22,.3);--hi:#121316;--on-hi:#FFCE1F}
.tone-ink{--bg:#121316;--fg:#F0EFEA;--mu:#9597A0;--line:#2E3036;--hi:#FFCE1F;--on-hi:#121316}
.ts-sec{background:var(--bg);color:var(--fg);position:relative}
.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 签名：卷尺刻度条 */
.tape{height:20px;opacity:.6;background:
  repeating-linear-gradient(90deg,var(--fg) 0 1px,transparent 1px 10px) left bottom/100% 7px no-repeat,
  repeating-linear-gradient(90deg,var(--fg) 0 2px,transparent 2px 50px) left bottom/100% 15px no-repeat}

/* 开头 */
.ts-intro .in{padding-block:clamp(40px,8vw,96px) clamp(32px,6vw,64px)}
.kicker{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;margin:0 0 18px;display:flex;gap:10px;align-items:center}
.kicker::before{content:"";width:30px;height:10px;flex-shrink:0;background:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 5px)}
.ts-intro h1{white-space:pre-line;font-weight:900;font-size:clamp(40px,8vw,100px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance;max-width:13em}
.lede{font-size:clamp(16px,1.9vw,20px);max-width:32em;margin:22px 0 0;text-wrap:pretty}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:30px 0 0;padding:0;list-style:none}
.toc a{display:inline-flex;gap:8px;align-items:baseline;text-decoration:none;border:2px solid var(--fg);padding:6px 12px;font-size:14px;font-weight:700}
.toc a span{font-family:var(--f-mono);font-weight:400;font-size:12px}
.toc a:hover{background:var(--fg);color:var(--bg)}

/* 场景标题 */
.sc-head{padding-block:clamp(52px,8vw,96px) 26px}
.sc-no{font-family:var(--f-mono);font-size:13px;color:var(--mu);margin:0 0 12px;letter-spacing:.04em}
.sc-head h2{white-space:pre-line;margin:0;font-weight:900;font-size:clamp(30px,5.2vw,58px);line-height:1.14;text-wrap:balance;max-width:16em}
.sc-lede{margin:14px 0 0;max-width:34em;font-size:clamp(15px,1.6vw,18px);text-wrap:pretty}
.contract{display:inline-block;margin:20px 0 0;font-family:var(--f-mono);font-size:14px;background:var(--hi);color:var(--on-hi);padding:5px 12px}
.punch{padding-block:36px clamp(56px,9vw,100px)}
.punch p{white-space:pre-line;margin:0;max-width:22em;font-weight:900;font-size:clamp(22px,3.4vw,36px);line-height:1.35;text-wrap:balance}

/* 读数条 */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-block:1px solid var(--line)}
.hud .in{display:flex;align-items:center;gap:8px 16px;padding-block:10px;flex-wrap:wrap}
.hud-read{display:flex;align-items:baseline;gap:8px;min-width:0}
.hud-lab{font-size:13px;color:var(--mu);white-space:nowrap}
.hud-val{font-family:var(--f-num);font-weight:800;font-stretch:78%;font-size:clamp(24px,3.4vw,34px);font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.hud-unit{font-size:14px;font-weight:700;white-space:nowrap}
.hud-sub{font-family:var(--f-mono);font-size:12px;color:var(--mu);white-space:nowrap}
.hud-bar{flex:1 1 100px;height:6px;background:var(--line);position:relative;min-width:60px}
.hud-bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--hi)}
.hud-btns{display:flex;gap:6px}
.hud button{font:inherit;font-size:13px;border:1px solid var(--fg);background:transparent;color:var(--fg);padding:4px 10px;cursor:pointer;white-space:nowrap}
.hud button:hover{background:var(--fg);color:var(--bg)}

/* 标尺 ruler */
.rl{position:relative;overflow:hidden}
.tone-night .rl{background-image:
  radial-gradient(1px 1px at 23px 41px,rgba(255,255,255,.6),transparent 70%),
  radial-gradient(1px 1px at 141px 97px,rgba(255,255,255,.35),transparent 70%),
  radial-gradient(1.5px 1.5px at 87px 173px,rgba(255,255,255,.5),transparent 70%),
  radial-gradient(1px 1px at 199px 13px,rgba(255,255,255,.3),transparent 70%),
  radial-gradient(1px 1px at 61px 211px,rgba(255,255,255,.25),transparent 70%);background-size:230px 230px}
.rl-axis{position:absolute;left:50%;width:2px;margin-left:-1px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 12px)}
.rl-body{position:absolute;left:50%;border-radius:50%;transform:translateX(-50%)}
.rl-name{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;font-weight:900;font-size:clamp(18px,2.4vw,26px);line-height:1.25}
.rl-name.above{transform:translate(-50%,-100%)}
.rl-name small{display:block;font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--mu)}
.rl-mark{position:absolute;left:50%;display:flex;align-items:center;gap:8px;transform:translateY(-50%);max-width:calc(50% - 8px)}
.rl-mark::before{content:"";width:18px;height:2px;background:var(--hi);flex-shrink:0}
.rl-mark span{font-size:14px;line-height:1.45;font-weight:700}
.rl-mark b{display:block;font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--mu)}
.rl-tick{position:absolute;right:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--mu);white-space:nowrap}
.rl-tick::after{content:"";width:10px;height:1px;background:var(--mu)}
.rl-quip{position:absolute;left:50%;transform:translate(-50%,-50%);width:max-content;max-width:min(22em,88%);text-align:center;font-size:clamp(15px,1.7vw,18px);background:var(--bg);padding:10px 14px;border:1px solid var(--line);text-wrap:balance}

/* 堆叠 stack */
.st-area{position:relative}
.st-tick{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.st-tick span{position:absolute;left:0;top:-9px;background:var(--bg);padding-right:6px;font-family:var(--f-mono);font-size:11px;color:var(--mu);line-height:1.5}
.st-bars{position:absolute;left:62px;right:0;top:0;bottom:0;display:flex;gap:clamp(8px,2vw,28px)}
.st-col{position:relative;flex:1 1 0;min-width:0;display:flex;justify-content:center;align-items:flex-end}
.st-bar{width:min(100%,128px);position:relative}
.st-cap{position:absolute;left:0;right:0;text-align:center;font-size:13px;line-height:1.35}
.st-cap b{display:block;font-size:clamp(14px,1.7vw,18px);font-weight:900}
.st-cap i{display:block;font-style:normal;font-family:var(--f-num);font-weight:800;font-stretch:80%;font-size:clamp(20px,2.6vw,28px);font-variant-numeric:tabular-nums}
.st-cap small{display:block;color:var(--mu);font-size:12px}
.st-ground{height:3px;background:var(--fg);margin-left:62px}

/* 点阵 dots */
.dt-legend{display:grid;gap:12px;margin:0 0 44px;padding:0;list-style:none;max-width:44em}
.dt-legend li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;align-items:start}
.dt-legend i{width:14px;height:14px;margin-top:6px}
.dt-legend b{font-weight:900}
.dt-legend em{font-style:normal;font-family:var(--f-mono);font-size:13px;margin-left:6px}
.dt-legend small{display:block;color:var(--mu);font-size:13px}
.dt-grid{position:relative;padding-bottom:8px}
.dt-grid canvas{display:block}
.dt-call{position:absolute;left:0;top:-6px;transform:translateY(-100%);font-size:14px;font-weight:700;color:var(--hi);white-space:nowrap;z-index:3}
.dt-ring{position:absolute;border:2px solid var(--hi);border-radius:999px;pointer-events:none;z-index:2;box-shadow:0 0 0 3px var(--bg);animation:ring 1.8s ease-in-out infinite}
@keyframes ring{50%{scale:1.25}}

/* 计数器 ticker */
.tk{padding-block:clamp(56px,10vw,120px)}
.tk-pre{font-size:clamp(20px,2.8vw,30px);font-weight:900;margin:0;max-width:20em;text-wrap:balance}
.tk-num{font-family:var(--f-num);font-weight:800;font-stretch:72%;font-variant-numeric:tabular-nums;font-size:clamp(64px,15vw,190px);line-height:.95;margin:14px 0 6px;color:var(--hi);overflow-wrap:anywhere}
.tk-suf{font-size:clamp(20px,2.8vw,30px);font-weight:900;margin:0}
.tk-meta{font-family:var(--f-mono);font-size:13px;color:var(--mu);margin:18px 0 0}

/* 结尾 */
.ts-end .in{padding-block:clamp(56px,9vw,110px);display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:clamp(28px,6vw,72px);align-items:start}
.end-card{aspect-ratio:3/4;background:var(--tape);color:var(--ink);padding:28px 26px 22px;display:flex;flex-direction:column;gap:16px;max-width:100%}
.end-card .kicker{margin:0}
.end-big{white-space:pre-line;margin:auto 0 0;font-weight:900;font-size:clamp(28px,4.4vw,42px);line-height:1.2;text-wrap:balance}
.end-text{margin:0;font-size:15px;text-wrap:pretty}
.end-card .tape{--fg:#121316;opacity:.8}
.src h3{margin:0 0 12px;font-size:16px;font-weight:900}
.src ol{margin:0;padding-left:1.3em;display:grid;gap:10px;font-size:14px}
.src li small{display:block;color:var(--mu)}
.src a{text-underline-offset:3px;overflow-wrap:anywhere}
.credit{margin:28px 0 0;font-family:var(--f-mono);font-size:12px;color:var(--mu)}
.ts-err{background:#E4412B;color:#fff;font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;padding:16px max(16px,env(safe-area-inset-left,0px))}

@media (max-width:700px){
  .ts-end .in{grid-template-columns:1fr}
  .hud-btns{width:100%}
  .hud .in{gap:6px 12px}
  .st-bars{left:44px}.st-ground{margin-left:44px}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.dt-ring{animation:none}}

    add(sec, head(s, i, '1 像素 = ' + num(per, 6) + ' ' + unit), hd.node, wrap, punch(s));
    updaters.push(function(){
      var r = area.getBoundingClientRect(); if (r.bottom < -200 || r.top > innerHeight + 200) return;

  }

  /* ---------- 点阵：1 个点 = 固定数量，一个不少地画出来 ---------- */
  function dots(s, sec, i){

          ring.style.width = ((cB - cA) * step + size + 2 * pd) + 'px'; ring.style.height = ((rB - rA) * step + size + 2 * pd) + 'px';
          ring.hidden = false;
          call.style.left = Math.max(0, Math.min(cA * step - pd, W - 260)) + 'px'; call.style.top = (rA * step - pd - 6) + 'px';
        } else { ring.hidden = true; }
      }
    }
    var hd = hud('已经看过', '个点', [['跳到最后', function(){ go(absTop(grid) + grid.offsetHeight - innerHeight * 0.6); }]]);
    add(sec, head(s, i, '1 个点 = ' + num(per) + ' ' + uname), hd.node, wrap, punch(s));
    resizers.push(draw);
    updaters.push(function(){
      var r = grid.getBoundingClientRect(); if (r.bottom < -200 || r.top > innerHeight + 200) return;
      var rowsSeen = Math.min(meta.rows, Math.max(0, (innerHeight * 0.55 - r.top) / step));
      var seen = Math.min(total, Math.round(rowsSeen * meta.cols));

      hd.fill.style.width = (seen / total * 100) + '%';
    });
  }

  /* ---------- 计数器：从打开页面那一刻开始累计 ---------- */
  function ticker(s, sec, i){
    var rate = +s.rate, unit = s.unit || '';
    if (!(rate > 0)) { errors.push('场景 ' + (i + 1) + '（ticker）需要 rate > 0'); return; }
    var w = inner('tk'), n = el('p', 'tk-num', '0'), meta = el('p', 'tk-meta');
    add(w, el('p', 'sc-no', pad2(i + 1) + (s.kicker ? ' · ' + s.kicker : '')), el('p', 'tk-pre', s.title || ''), n, s.suffix ? el('p', 'tk-suf', s.suffix) : null, meta, s.note ? el('p', 'sc-lede', s.note) : null);

  }

  var R = {ruler: ruler, stack: stack, dots: dots, ticker: ticker};
  document.title = C.title || '比例尺';
  var scenes = C.scenes || [];

  var intro = section(C.tone || 'tape', 'ts-intro'), ii = inner();
  add(ii, el('p', 'kicker', C.kicker || '比例尺 · to-scale'), el('h1', null, C.title || '比例尺'), C.lede ? el('p', 'lede', C.lede) : null);
  if (scenes.length > 1){
    var toc = el('ul', 'toc');
    scenes.forEach(function(s, k){ var li = el('li'), a = el('a'); a.href = '#s' + (k + 1); add(a, el('span', null, pad2(k + 1)), document.createTextNode(s.title || s.type)); li.appendChild(a); toc.appendChild(li); });

  add(intro, ii, el('div', 'tape'));
  root.appendChild(intro);

  scenes.forEach(function(s, k){
    var sec = section(s.tone || (k % 2 ? 'paper' : 'ink'), 'ts-scene ts-' + s.type, 's' + (k + 1));

  add(card, el('p', 'kicker', E.kicker || C.kicker || '比例尺'), el('p', 'end-big', E.big || C.title || ''), E.text ? el('p', 'end-text', E.text) : null, el('div', 'tape'));
  var src = el('div', 'src');
  if ((C.sources || []).length){
    src.appendChild(el('h3', null, '数据来源'));
    var ol = el('ol');
    C.sources.forEach(function(x){ var li = el('li'); if (x.url){ var a = el('a', null, x.label || x.url); a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; li.appendChild(a); } else li.appendChild(document.createTextNode(x.label || '')); if (x.note) li.appendChild(el('small', null, x.note)); ol.appendChild(li); });
    src.appendChild(ol);
  }
  if (C.credit !== false) src.appendChild(el('p', 'credit', C.credit || '用「比例尺 to-scale」制作 · 开源 Claude Skill'));
  add(ei, card, src); end.appendChild(ei); root.appendChild(end);

  if (errors.length){ var box = el('div', 'ts-err', '比例尺配置有问题：\n· ' + errors.join('\n· ')); root.insertBefore(box, root.firstChild); if (window.console) console.error(box.textContent); }

  var pending = false;
  function onScroll(){ if (pending) return; pending = true; requestAnimationFrame(function(){ pending = false; updaters.forEach(function(f){ f(); }); }); }
  var rt; function onResize(){ clearTimeout(rt); rt = setTimeout(function(){ resizers.forEach(function(f){ f(); }); onScroll(); }, 150); }
  resizers.forEach(function(f){ f(); });
  window.addEventListener('scroll', onScroll, {passive: true});
  window.addEventListener('resize', onResize);
  onScroll();
})();
</script>
